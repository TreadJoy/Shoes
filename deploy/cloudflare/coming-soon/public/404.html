<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <link rel="stylesheet" href="/styles.css">
    <title>Page Not Found | TreadJoy</title>
  </head>
  <body>
    <main class="poster poster--not-found" aria-labelledby="page-title">
      <div class="poster__frame">
        <p class="brand">TreadJoy</p>
        <section class="message message--not-found" aria-describedby="page-summary">
          <p class="error-code" aria-hidden="true">404</p>
          <h1 id="page-title">Page Not Found</h1>
          <p id="page-summary">The page you requested does not exist.</p>
          <a class="home-link" href="/">Return Home</a>
        </section>
      </div>
    </main>
  </body>
</html>
