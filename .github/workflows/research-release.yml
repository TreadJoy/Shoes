          test -n "$ROLLBACK_DEPLOY_ID" || { echo "rollback_deploy_id is required." >&2; exit 1; }
          python scripts/render_release.py rollback --service-id "$RENDER_SERVICE_ID" --deploy-id "$ROLLBACK_DEPLOY_ID" --target production

      - name: Retain rollback evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
