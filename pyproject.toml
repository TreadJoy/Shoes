[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
  ".git",
  ".pnpm-store",
  ".venv",
  ".wrangler",
  "media",
  "node_modules",
  "staticfiles",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"treadjoy/ci_settings.py" = ["F403", "F405"]
"**/__init__.py" = ["F401"]
