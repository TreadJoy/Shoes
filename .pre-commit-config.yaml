repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: repository-hygiene
        name: repository hygiene
        entry: python scripts/check_repository_hygiene.py
        language: system
        pass_filenames: false
      - id: ruff-check
        name: Ruff correctness checks
        entry: .venv/bin/python -m ruff check manage.py treadjoy web scripts
        language: system
        pass_filenames: false
