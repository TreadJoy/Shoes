{% load static %}

<figure class="night-grid-exploded-hero">
    <div class="night-grid-exploded-frame">
        <picture>
            <source
                media="(min-width: 960px)"
                srcset="{% static 'images/heritage-court/night-grid-exploded-1600.webp' %} 1600w"
                sizes="(min-width: 1024px) 48vw, 100vw"
                type="image/webp"
            >
            <img
                src="{% static 'images/heritage-court/night-grid-exploded-960.webp' %}"
                srcset="{% static 'images/heritage-court/night-grid-exploded-960.webp' %} 960w, {% static 'images/heritage-court/night-grid-exploded-1600.webp' %} 1600w"
                sizes="(min-width: 1024px) 48vw, 100vw"
                width="1600"
                height="900"
                alt="Exploded TreadJoy Heritage Court Night Grid concept showing seven labeled visual parts: front shell with eyelets, combined bootie and sole, tongue, laces, back panel, logo holder, and back loop."
                loading="eager"
                decoding="async"
                fetchpriority="high"
            >
        </picture>
    </div>
    <figcaption class="night-grid-exploded-caption">
        <span class="night-grid-exploded-index" aria-hidden="true">00</span>
        <span class="night-grid-exploded-copy">
            <strong>Night Grid / Exploded Study</strong>
            <span>Front Shell · Bootie &amp; Sole · Tongue · Laces · Back Panel · Logo Holder · Back Loop</span>
            <small>Visual separation only. Attachment interfaces and removal mechanics are not represented or verified.</small>
        </span>
    </figcaption>
</figure>
