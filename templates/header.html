<!-- templates/header.html -->

{% load static %}

<header class="top-bar">

    <!-- Logo -->
    <div class="btn">
        <a href="{% url 'home' %}" class="btn-clear">
            <img
                src="{% static 'images/LogoClearBackground.png' %}"
                alt="TreadJoy Logo"
                class="top-bar-logo"
            >
        </a>
    </div>

    <!-- Navigation -->
    <div class="nav-buttons">

        {% if user.is_authenticated %}

            <span class="welcome-text">
                Hello, {{ user.username }}
            </span>

            <a href="{% url 'cart' %}" class="cart-btn">
                <!--
                version: "2.30"
                unicode: "fc3f"
                -->
                <svg class="cart-icon"
                     xmlns="http://www.w3.org/2000/svg"
                     width="50"
                     height="50"
                     viewBox="0 0 24 24"
                     fill="currentColor">
                    <path d="M6 2a1 1 0 0 1 .993 .883l.007 .117v1.068l13.071 .935a1 1 0 0 1 .929 1.024l-.01 .114l-1 7a1 1 0 0 1 -.877 .853l-.113 .006h-12v2h10a3 3 0 1 1 -2.995 3.176l-.005 -.176l.005 -.176c.017 -.288 .074 -.564 .166 -.824h-5.342a3 3 0 1 1 -5.824 1.176l-.005 -.176l.005 -.176a3.002 3.002 0 0 1 1.995 -2.654v-12.17h-1a1 1 0 0 1 -.993 -.883l-.007 -.117a1 1 0 0 1 .883 -.993l.117 -.007h2zm0 16a1 1 0 1 0 0 2a1 1 0 0 0 0 -2zm11 0a1 1 0 1 0 0 2a1 1 0 0 0 0 -2z" />
                </svg>
            </a>

            <a href="{% url 'signout' %}" class="btn btn-primary">
                Sign Out
            </a>

        {% else %}

            <a href="{% url 'signin' %}" class="btn btn-primary">
                Sign In
            </a>

            <a href="{% url 'signup' %}" class="btn btn-primary">
                Sign Up
            </a>

        {% endif %}
    </div>

</header>
