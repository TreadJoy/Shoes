<!-- templates/survey_question.html -->

{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>TreadJoy Survey</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

{% include "header.html" %}

<main class="form-page">
    <div class="form-box">
        <h2>Question {{ step }} of {{ total_steps }}</h2>

        <form method="post">
            {% csrf_token %}

            <p>{{ question.text }}</p>

            <input type="hidden" name="step" value="{{ step }}">

            {% if question.type == "likert" %}
                <div class="likert-scale">
                    <label>
                        <input type="radio" name="{{ question.field }}" value="1"
                        {% if saved_value == "1" %}checked{% endif %} required>
                        Strongly Disagree
                    </label>

                    <label>
                        <input type="radio" name="{{ question.field }}" value="2"
                        {% if saved_value == "2" %}checked{% endif %}>
                        Disagree
                    </label>

                    <label>
                        <input type="radio" name="{{ question.field }}" value="3"
                        {% if saved_value == "3" %}checked{% endif %}>
                        Neutral
                    </label>

                    <label>
                        <input type="radio" name="{{ question.field }}" value="4"
                        {% if saved_value == "4" %}checked{% endif %}>
                        Agree
                    </label>

                    <label>
                        <input type="radio" name="{{ question.field }}" value="5"
                        {% if saved_value == "5" %}checked{% endif %}>
                        Strongly Agree
                    </label>
                </div>
            {% else %}
                <textarea
                    name="{{ question.field }}"
                    class="survey-textarea"
                    rows="5"
                    placeholder="Your answer..."
                    required>{%  if saved_value %}{{ saved_value }}{% endif %}</textarea>
            {% endif %}

            <div class="survey-buttons">
                <button type="submit" name="action" value="back" class="btn btn-secondary">
                    Back
                </button>

                {% if is_last %}
                    <button type="submit" name="action" value="submit" class="btn btn-primary">
                        Submit
                    </button>
                {% else %}
                    <button type="submit" name="action" value="next" class="btn btn-primary">
                        Next
                    </button>
                {% endif %}
            </div>
        </form>
    </div>
</main>

</body>
</html>
