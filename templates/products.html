{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    {% include "header.html" %}

    <main class="products-page">
        <h2 class="page-title">Our Shoes</h2>

        <div class="product-grid">
            {% for product in products %}
            <div class="product-card">
                <img src="{% static 'images/shoe_example.jpeg' %}" class="product-img">

                <h3>{{ product.name }}</h3>
                <p>${{ product.price }}</p>

                <a href="{% url 'add_to_cart' %}?id={{ product.id }}" class="btn btn-primary">
                Add to Cart
                 </a>
            </div>
            {% endfor %}
        </div>
    </main>

</body>
</html>
